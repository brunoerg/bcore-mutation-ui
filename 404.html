<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bitcoin Core — Mutation Testing Dashboard</title>
<!--
  GitHub Pages has no server-side routing, so a deep link like
  /src/net_processing.cpp or /pull/35221/src/net_processing.cpp#2416 hits this
  404 page. We encode the requested path into a query string and redirect to
  the site root, where index.html decodes it back into a clean URL and the SPA
  renders the right view. Technique: https://github.com/rafgraph/spa-github-pages

  pathSegmentsToKeep = 0 because the site is served from the domain root
  (custom apex domain via CNAME).
-->
<script>
  (function () {
    var pathSegmentsToKeep = 0;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  }());
</script>
</head>
<body>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitcoin Core — Mutation Testing Dashboard</title>
<!-- SPA deep-link restore: decodes the ?/… path that 404.html produced on
     GitHub Pages back into a clean URL before the app boots. See 404.html. -->
<script>
  (function (l) {
    if (l.search[1] === '/') {
      var decoded = l.search.slice(1).split('&').map(function (s) {
        return s.replace(/~and~/g, '&');
      }).join('?');
      window.history.replaceState(null, null,
        l.pathname.slice(0, -1) + decoded + l.hash);
    }
  }(window.location));
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap">
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2128;
    --border: #30363d;
    --border2: #21262d;
    --text: #e6edf3;
    --text2: #8b949e;
    --text3: #484f58;
    --killed: #3fb950;
    --killed-bg: #0d2d1a;
    --survived: #f85149;
    --survived-bg: #2d0d0d;
    --pending: #d29922;
    --pending-bg: #2d2205;
    --accent: #f7931a;
    --accent-dim: #7d4a0d;
    --diff-add: #0d2d1a;
    --diff-add-line: #3fb950;
    --diff-rem: #2d0d0d;
    --diff-rem-line: #f85149;
    --diff-hunk: #1a1f26;
    --diff-hunk-text: #58a6ff;
    --scrollbar: #30363d;
    --radius: 6px;
    --font-mono: 'IBM Plex Mono', monospace;
    --font-sans: 'IBM Plex Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 20px;
    height: 52px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  .header-logo {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btc-icon {
    width: 22px;
    height: 22px;
    background: var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: #000;
    flex-shrink: 0;
  }

  .header-title { font-size: 13px; color: var(--text2); font-weight: 300; }
  .header-sep { color: var(--text3); margin: 0 4px; }
  .header-tabs { display: flex; gap: 2px; margin-left: auto; }

  .tab-btn {
    padding: 5px 14px;
    border-radius: var(--radius);
    border: 1px solid transparent;
    background: transparent;
    color: var(--text2);
    font-family: var(--font-sans);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .tab-btn:hover { background: var(--surface2); color: var(--text); }
  .tab-btn.active { background: var(--surface2); border-color: var(--border); color: var(--text); }

  .commit-badge {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text3);
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 4px;
    padding: 2px 8px;
    margin-left: 8px;
  }

  .main { display: flex; flex: 1; overflow: hidden; }

  .sidebar {
    width: 280px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    background: var(--surface);
    overflow: hidden;
  }

  .sidebar-header { padding: 12px 16px 8px; border-bottom: 1px solid var(--border2); flex-shrink: 0; }

  .sidebar-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text3);
    margin-bottom: 8px;
  }

  .sidebar-search {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 6px 10px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 12px;
    outline: none;
    transition: border-color 0.15s;
  }
  .sidebar-search:focus { border-color: var(--accent); }
  .sidebar-search::placeholder { color: var(--text3); }

  .file-list { flex: 1; overflow-y: auto; padding: 8px 0; }
  .file-list::-webkit-scrollbar { width: 6px; }
  .file-list::-webkit-scrollbar-track { background: transparent; }
  .file-list::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }

  .file-group-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text3);
    padding: 10px 16px 4px;
  }

  .file-item {
    display: flex;
    align-items: center;
    padding: 6px 16px;
    cursor: pointer;
    transition: background 0.1s;
    gap: 8px;
    border-left: 2px solid transparent;
    position: relative;
  }
  .file-item:hover { background: var(--surface2); }
  .file-item.active { background: var(--surface2); border-left-color: var(--accent); }
  .file-item.disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }

  .file-name {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    min-width: 0;
  }
  .file-dir { color: var(--text3); }

  .score-pip { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

  .score-badge {
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .score-high { background: var(--killed-bg); color: var(--killed); }
  .score-med { background: #2d2205; color: #d29922; }
  .score-low { background: var(--survived-bg); color: var(--survived); }
  .score-pending { background: var(--pending-bg); color: var(--pending); }
  .score-nodata { background: var(--surface2); color: var(--text3); }

  .content { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

  .overview { padding: 24px; overflow-y: auto; flex: 1; }
  .overview::-webkit-scrollbar { width: 6px; }
  .overview::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }

  .overview-title { font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .overview-sub { font-family: var(--font-mono); font-size: 12px; color: var(--text2); margin-bottom: 24px; }

  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 28px; }

  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .stat-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  .stat-value { font-family: var(--font-mono); font-size: 26px; font-weight: 600; line-height: 1; }
  .stat-value.green { color: var(--killed); }
  .stat-value.red { color: var(--survived); }
  .stat-value.yellow { color: var(--pending); }
  .stat-value.orange { color: var(--accent); }
  .stat-sub { font-size: 11px; color: var(--text3); margin-top: 4px; }

  .section-title {
    font-size: 13px; font-weight: 600; color: var(--text2); text-transform: uppercase;
    letter-spacing: 0.06em; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border2);
  }

  .files-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .files-table th {
    text-align: left; padding: 8px 12px; color: var(--text3); font-weight: 500;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    border-bottom: 1px solid var(--border); font-family: var(--font-sans);
  }
  .files-table td { padding: 10px 12px; border-bottom: 1px solid var(--border2); font-family: var(--font-mono); font-size: 11px; }
  .files-table tr:hover td { background: var(--surface2); cursor: pointer; }

  .score-bar-wrap { display: flex; align-items: center; gap: 8px; }
  .score-bar { height: 4px; border-radius: 2px; background: var(--border); flex: 1; overflow: hidden; }
  .score-bar-fill { height: 100%; border-radius: 2px; transition: width 0.5s ease; }

  .file-detail { display: flex; flex-direction: column; flex: 1; overflow: hidden; }

  .detail-header {
    padding: 12px 20px; border-bottom: 1px solid var(--border);
    background: var(--surface); flex-shrink: 0; display: flex; align-items: center; gap: 12px;
  }
  .detail-filepath { font-family: var(--font-mono); font-size: 13px; color: var(--text); flex: 1; }
  .detail-filepath .dir { color: var(--text3); }
  .detail-stats { display: flex; gap: 16px; align-items: center; }
  .detail-stat { display: flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 12px; }

  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot-killed { background: var(--killed); }
  .dot-survived { background: var(--survived); }
  .dot-pending { background: var(--pending); }

  .detail-body { display: flex; flex: 1; overflow: hidden; }

  .mutant-list-panel {
    width: 300px; flex-shrink: 0; border-right: 1px solid var(--border);
    overflow: hidden; display: flex; flex-direction: column;
  }

  .mutant-list-toolbar {
    padding: 10px 12px; border-bottom: 1px solid var(--border2);
    display: flex; gap: 6px; flex-wrap: wrap; flex-shrink: 0;
  }

  .filter-btn {
    padding: 3px 10px; border-radius: 20px; border: 1px solid var(--border);
    background: transparent; font-size: 11px; font-family: var(--font-sans);
    cursor: pointer; transition: all 0.15s; color: var(--text2);
  }
  .filter-btn:hover { background: var(--surface2); color: var(--text); }
  .filter-btn.active-killed { background: var(--killed-bg); border-color: var(--killed); color: var(--killed); }
  .filter-btn.active-survived { background: var(--survived-bg); border-color: var(--survived); color: var(--survived); }
  .filter-btn.active-pending { background: var(--pending-bg); border-color: var(--pending); color: var(--pending); }
  .filter-btn.active-all { background: var(--surface2); border-color: var(--border); color: var(--text); }

  .mutant-list { flex: 1; overflow-y: auto; }
  .mutant-list::-webkit-scrollbar { width: 5px; }
  .mutant-list::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }

  .mutant-item {
    padding: 10px 14px; border-bottom: 1px solid var(--border2);
    cursor: pointer; transition: background 0.1s; display: flex; align-items: flex-start; gap: 10px;
  }
  .mutant-item:hover { background: var(--surface2); }
  .mutant-item.active { background: var(--surface2); border-left: 2px solid var(--accent); padding-left: 12px; }

  .mutant-status-icon {
    width: 18px; height: 18px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; flex-shrink: 0; margin-top: 1px;
  }
  .si-killed { background: var(--killed-bg); color: var(--killed); border: 1px solid var(--killed); }
  .si-survived { background: var(--survived-bg); color: var(--survived); border: 1px solid var(--survived); }
  .si-pending { background: var(--pending-bg); color: var(--pending); border: 1px solid var(--pending); }

  .mutant-info { flex: 1; min-width: 0; }
  .mutant-id { font-family: var(--font-mono); font-size: 10px; color: var(--text3); margin-bottom: 2px; }
  .mutant-op { font-family: var(--font-mono); font-size: 11px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mutant-count { font-family: var(--font-mono); font-size: 10px; color: var(--text3); padding: 8px 14px; border-top: 1px solid var(--border2); flex-shrink: 0; }

  .diff-panel { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

  .diff-toolbar {
    padding: 8px 16px; border-bottom: 1px solid var(--border2);
    display: flex; align-items: center; gap: 12px; flex-shrink: 0; background: var(--surface);
  }
  .diff-toolbar-label { font-family: var(--font-mono); font-size: 11px; color: var(--text2); flex: 1; }

  .copy-btn {
    display: flex; align-items: center; gap: 6px; padding: 5px 12px;
    background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text2); font-family: var(--font-sans); font-size: 11px; cursor: pointer; transition: all 0.15s;
  }
  .copy-btn:hover { background: var(--bg); color: var(--text); border-color: var(--text3); }
  .copy-btn.copied { background: var(--killed-bg); border-color: var(--killed); color: var(--killed); }

  .diff-content { flex: 1; overflow: auto; }
  .diff-content::-webkit-scrollbar { width: 6px; height: 6px; }
  .diff-content::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }

  .diff-table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 12px; line-height: 1.6; }
  .diff-table td { padding: 0; white-space: pre; }

  .diff-line-num {
    width: 48px; min-width: 48px; padding: 0 8px; text-align: right;
    color: var(--text3); user-select: none; border-right: 1px solid var(--border2);
    background: var(--surface); font-size: 11px;
  }
  .diff-line-code { padding: 0 12px; width: 100%; }

  .diff-line-add td { background: var(--diff-add); }
  .diff-line-add .diff-line-num { background: #0d2a18; color: var(--killed); }
  .diff-line-add .diff-line-code { color: var(--killed); }

  .diff-line-rem td { background: var(--diff-rem); }
  .diff-line-rem .diff-line-num { background: #2a0d0d; color: var(--survived); }
  .diff-line-rem .diff-line-code { color: var(--survived); }

  .diff-line-hunk td { background: var(--diff-hunk); }
  .diff-line-hunk .diff-line-num { background: #0d1520; }
  .diff-line-hunk .diff-line-code { color: var(--diff-hunk-text); font-style: italic; }

  .diff-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text3); gap: 8px; }
  .diff-empty-icon { font-size: 32px; opacity: 0.3; }
  .diff-empty-text { font-size: 13px; }

  .view-weekly { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
  .view-pr { display: flex; flex-direction: column; flex: 1; overflow: hidden; }

  .pr-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; gap: 16px; color: var(--text3); }
  .pr-empty-icon { font-size: 48px; opacity: 0.2; }
  .pr-empty-title { font-size: 16px; color: var(--text2); }
  .pr-empty-sub { font-size: 13px; max-width: 400px; text-align: center; line-height: 1.6; }

  .pr-badge {
    display: inline-flex; align-items: center; gap: 6px; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px;
    font-family: var(--font-mono); font-size: 12px; color: var(--text2);
  }

  .cmd-panel {
    border-top: 1px solid var(--border2); background: var(--surface);
    flex-shrink: 0; max-height: 160px; overflow: hidden; display: flex; flex-direction: column;
  }
  .cmd-header { display: flex; align-items: center; justify-content: space-between; padding: 7px 16px; border-bottom: 1px solid var(--border2); flex-shrink: 0; }
  .cmd-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text3); display: flex; align-items: center; gap: 6px; }
  .cmd-title-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .cmd-copy-btn {
    display: flex; align-items: center; gap: 5px; padding: 3px 10px;
    background: transparent; border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text3); font-family: var(--font-sans); font-size: 11px; cursor: pointer; transition: all 0.15s;
  }
  .cmd-copy-btn:hover { background: var(--surface2); color: var(--text); border-color: var(--text3); }
  .cmd-copy-btn.copied { background: var(--killed-bg); border-color: var(--killed); color: var(--killed); }
  .cmd-body { padding: 10px 16px; overflow-y: auto; flex: 1; }
  .cmd-body::-webkit-scrollbar { width: 5px; }
  .cmd-body::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }
  .cmd-steps { display: flex; flex-direction: column; gap: 4px; }
  .cmd-step { display: flex; align-items: flex-start; gap: 8px; }
  .cmd-step-num { font-family: var(--font-mono); font-size: 10px; color: var(--text3); min-width: 16px; text-align: right; padding-top: 1px; flex-shrink: 0; }
  .cmd-step-text { font-family: var(--font-mono); font-size: 11px; color: var(--text2); line-height: 1.5; word-break: break-all; }
  .cmd-step-text .cmd-binary { color: var(--accent); }
  .cmd-step-text .cmd-flag { color: #58a6ff; }
  .cmd-step-text .cmd-fuzz-env { color: #d2a8ff; }

  .report-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text2);
    font-family: var(--font-sans);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
    text-decoration: none;
  }
  .report-btn:hover { background: var(--survived-bg); border-color: var(--survived); color: var(--survived); }

  /* ── PR LIST ────────────────────────────────────────────────────────────────── */
  .pr-list-view { padding: 24px; overflow-y: auto; flex: 1; }
  .pr-list-view::-webkit-scrollbar { width: 6px; }
  .pr-list-view::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }

  .pr-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .pr-card:hover { background: var(--surface2); border-color: var(--accent); }

  .pr-card-number {
    font-family: var(--font-mono);
    font-size: 18px;
    font-weight: 600;
    color: var(--accent);
    flex-shrink: 0;
    min-width: 72px;
  }

  .pr-card-body { flex: 1; min-width: 0; }

  .pr-card-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text1);
    margin-bottom: 6px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .pr-card-meta {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text3);
    margin-bottom: 8px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .pr-card-stats {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .pr-stat-pill {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 3px;
  }

  .pr-score-bar-wrap { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 120px; }

  .pr-card-arrow { color: var(--text3); font-size: 16px; flex-shrink: 0; }

  /* PR detail back-nav header */
  .pr-detail-topbar {
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text2);
  }
  .pr-detail-topbar button {
    background: none; border: none; color: var(--text2);
    cursor: pointer; font-size: 16px; padding: 0 4px;
  }

  /* ── BURGER BUTTON ─────────────────────────────────────────────────────────── */
  .burger-btn {
    display: none;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    width: 32px;
    height: 32px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    flex-shrink: 0;
    border-radius: var(--radius);
    transition: background 0.15s;
  }
  .burger-btn:hover { background: var(--surface2); }
  .burger-btn span {
    display: block;
    width: 18px;
    height: 2px;
    background: var(--text2);
    border-radius: 2px;
    transition: all 0.2s;
  }
  .burger-btn.open span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
  .burger-btn.open span:nth-child(2) { opacity: 0; }
  .burger-btn.open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

  /* ── OVERLAY ────────────────────────────────────────────────────────────────── */
  .sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 99;
    backdrop-filter: blur(2px);
  }
  .sidebar-overlay.active { display: block; }

  /* ── RESPONSIVE ─────────────────────────────────────────────────────────────── */
  @media (max-width: 768px) {
    .hide-mobile { display: none !important; }

    .burger-btn { display: flex; }

    /* Sidebar becomes a fixed drawer */
    .sidebar {
      position: fixed;
      top: 52px;
      left: 0;
      bottom: 0;
      width: 85vw;
      max-width: 320px;
      z-index: 100;
      transform: translateX(-105%);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 4px 0 24px rgba(0,0,0,0.4);
    }
    .sidebar.open { transform: translateX(0); }

    /* Stats grid: 2 columns */
    .stats-grid { grid-template-columns: repeat(2, 1fr); }

    /* Overview padding */
    .overview { padding: 16px; }

    /* Hide K/S/P columns in files table, keep file + score */
    .files-table th:nth-child(2),
    .files-table th:nth-child(3),
    .files-table th:nth-child(4),
    .files-table td:nth-child(2),
    .files-table td:nth-child(3),
    .files-table td:nth-child(4) { display: none; }

    /* File detail: stack mutant list above diff */
    .detail-body { flex-direction: column; }

    .mutant-list-panel {
      width: 100%;
      max-height: 260px;
      border-right: none;
      border-bottom: 1px solid var(--border);
    }

    /* Detail header: wrap stats below filepath */
    .detail-header { flex-wrap: wrap; gap: 8px; }
    .detail-filepath { width: 100%; }
    .detail-stats { width: 100%; flex-wrap: wrap; gap: 8px; }

    /* Diff toolbar: icon-only copy/report on mobile */
    .diff-toolbar { flex-wrap: wrap; gap: 6px; padding: 6px 12px; }
    .diff-toolbar-label { width: 100%; font-size: 10px; }
    .copy-btn .btn-label, .report-btn .btn-label { display: none; }
    .copy-btn, .report-btn { padding: 6px 8px; }

    /* Command panel smaller */
    .cmd-panel { max-height: 120px; }

    /* Mutant list items: bigger tap targets */
    .mutant-item { padding: 12px 14px; }
  }

  @media (max-width: 480px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .stat-value { font-size: 22px; }
    .overview-title { font-size: 15px; }
    .header-logo-text { display: none; }
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .fade-in { animation: fadeIn 0.2s ease; }
</style>
</head>
<body>

<header>
  <button class="burger-btn" id="burgerBtn" onclick="toggleSidebar()" aria-label="Toggle file list">
    <span></span><span></span><span></span>
  </button>
  <div class="header-logo">
    <div class="btc-icon">₿</div>
    <span class="header-logo-text">Bitcoin Core</span>
  </div>
  <span class="header-sep hide-mobile">/</span>
  <span class="header-title hide-mobile">Mutation Testing Dashboard</span>
  <span class="commit-badge hide-mobile" id="commitBadge">loading...</span>
  <div class="header-tabs">
    <button class="tab-btn active" onclick="switchView('weekly')" id="tabWeekly">Weekly</button>
    <button class="tab-btn" onclick="switchView('pr')" id="tabPr">Per PR</button>
  </div>
</header>

<!-- Mobile sidebar overlay -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<div class="main">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-label">Source Files</div>
      <input class="sidebar-search" type="text" placeholder="Filter files..." oninput="filterFiles(this.value)" id="fileSearch">
    </div>
    <div class="file-list" id="fileList"></div>
  </div>

  <div class="content">
    <div class="view-weekly" id="viewWeekly">
      <div id="weeklyContent" style="display:flex;flex-direction:column;flex:1;overflow:hidden;"></div>
    </div>
    <div class="view-pr" id="viewPr" style="display:none;">
      <div id="prContent" style="display:flex;flex-direction:column;flex:1;overflow:hidden;"></div>
    </div>
  </div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────

async function loadData() {
  const res = await fetch('/public/mutation_data.json');
  const data = await res.json();

  window.DB        = { mutants: data.mutants, runs: data.runs };
  window.DIFFS     = data.diffs;
  window.FILE_CMDS = data.file_cmds;
  window.PR_DATA   = data.prs || {};   // { "1234": { run, mutants, diffs, file_cmds, stats } }

  init();
}

loadData();

// ── STATE ─────────────────────────────────────────────────────────────────────
let currentView      = 'weekly';
let selectedFile     = null;
let selectedMutantId = null;
let mutantFilter     = 'all';
let fileSearchQuery  = '';

// Populated in init() after DB is loaded — must NOT reference DB at top level
let testedFiles = {};

// ── URL ROUTING ───────────────────────────────────────────────────────────────
// URL shapes (all shareable / bookmarkable, backed by 404.html on GitHub Pages):
//   /                                            weekly overview
//   /src/net_processing.cpp                      weekly, file selected
//   /src/net_processing.cpp#3434                 weekly, file + mutant 3434
//   /pull                                        PR list
//   /pull/35221                                  PR detail
//   /pull/35221/src/net_processing.cpp           PR, file selected
//   /pull/35221/src/net_processing.cpp#2416      PR, file + mutant 2416
let suppressUrlUpdate = false;   // true while we mutate state to match the URL

function parseRoute() {
  let path = window.location.pathname.replace(/^\/+/, '').replace(/\/+$/, '');
  try { path = decodeURIComponent(path); } catch (e) {}
  const rawHash = window.location.hash.replace(/^#/, '');
  const mutant = /^\d+$/.test(rawHash) ? parseInt(rawHash, 10) : null;
  const route = { view: 'weekly', pr: null, file: null, mutant };

  if (path === '') return route;
  if (path === 'pull') { route.view = 'pr'; return route; }
  if (path.indexOf('pull/') === 0) {
    route.view = 'pr';
    const rest = path.slice('pull/'.length);
    const slash = rest.indexOf('/');
    if (slash === -1) { route.pr = rest; }
    else { route.pr = rest.slice(0, slash); route.file = rest.slice(slash + 1); }
    return route;
  }
  route.file = path;   // weekly file
  return route;
}

function buildUrl() {
  let path;
  if (selectedPr !== null) {
    path = '/pull/' + selectedPr + (selectedFile ? '/' + selectedFile : '');
  } else if (currentView === 'pr') {
    path = '/pull';
  } else {
    path = selectedFile ? '/' + selectedFile : '/';
  }
  return path + (selectedMutantId !== null ? '#' + selectedMutantId : '');
}

function syncUrl() {
  if (suppressUrlUpdate) return;
  const url = buildUrl();
  if (url !== window.location.pathname + window.location.hash) {
    history.pushState(null, '', url);
  }
}

// Drive app state from a parsed route. Suppresses URL writes so the address bar
// stays the source of truth (used on first load and on back/forward).
function applyRoute(route) {
  suppressUrlUpdate = true;
  try {
    if (route.view === 'pr') {
      if (currentView !== 'pr') switchView('pr');
      if (route.pr && PR_DATA[route.pr]) {
        if (selectedPr !== route.pr) selectPr(route.pr);
        if (route.file && testedFiles[route.file]) {
          if (selectedFile !== route.file) selectFile(route.file);
          selectMutantIfPresent(route.mutant, route.file);
        } else if (selectedFile !== null) {
          selectPr(route.pr);   // re-render PR overview, clear file
        }
      } else if (selectedPr !== null) {
        backToPrList();
      }
    } else {
      if (currentView !== 'weekly') switchView('weekly');
      if (route.file && testedFiles[route.file]) {
        if (selectedFile !== route.file) selectFile(route.file);
        selectMutantIfPresent(route.mutant, route.file);
      } else if (selectedFile !== null) {
        backToOverview();
      }
    }
  } finally {
    suppressUrlUpdate = false;
  }
}

function selectMutantIfPresent(id, file) {
  if (id === null) return;
  const pool = selectedPr ? (PR_DATA[selectedPr]?.mutants || []) : DB.mutants;
  if (pool.some(m => m.id === id && m.file_path === file)) selectMutant(id);
}

window.addEventListener('popstate', () => applyRoute(parseRoute()));
window.addEventListener('hashchange', () => applyRoute(parseRoute()));

// ── INIT ──────────────────────────────────────────────────────────────────────
function init() {
  testedFiles = {};
  DB.mutants.forEach(m => {
    if (!m.file_path) return;
    if (!testedFiles[m.file_path]) {
      testedFiles[m.file_path] = { killed: 0, survived: 0, pending: 0, mutants: [] };
    }
    testedFiles[m.file_path][m.status]++;
    testedFiles[m.file_path].mutants.push(m.id);
  });

  const commit = DB.runs[0]?.commit_hash || '';
  document.getElementById('commitBadge').textContent = commit.slice(0, 8);

  renderFileList();
  renderOverview();
  renderPrList();
  fetchBitcoinCoreFiles();
  fetchPrTitles(Object.keys(PR_DATA));

  // Snapshot weekly state so we can restore it when leaving a PR detail view
  window._weeklySnapshot = {
    diffs:       window.DIFFS,
    file_cmds:   window.FILE_CMDS,
    testedFiles: { ...testedFiles },
  };

  // Apply the deep link from the address bar, then canonicalise it (drops any
  // trailing slash or a stale file/mutant that no longer exists).
  applyRoute(parseRoute());
  history.replaceState(null, '', buildUrl());
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function getMutationScore(stats) {
  const tested = stats.killed + stats.survived;
  if (tested === 0) return null;
  return Math.round(stats.killed / tested * 100);
}

function scoreClass(score) {
  if (score === null) return 'score-pending';
  if (score >= 80) return 'score-high';
  if (score >= 50) return 'score-med';
  return 'score-low';
}

function scoreColor(score) {
  if (score === null) return 'var(--pending)';
  if (score >= 80) return 'var(--killed)';
  if (score >= 50) return 'var(--pending)';
  return 'var(--survived)';
}

// ── GITHUB FILE TREE ──────────────────────────────────────────────────────────
const GH_CACHE_KEY = 'btc_filetree_v2';
const GH_CACHE_TTL = 6 * 60 * 60 * 1000;

async function fetchBitcoinCoreFiles() {
  try {
    const cached = localStorage.getItem(GH_CACHE_KEY);
    if (cached) {
      const { ts, data } = JSON.parse(cached);
      if (Date.now() - ts < GH_CACHE_TTL) { renderFileList(data); return; }
    }
    const commit = DB.runs[0]?.commit_hash || 'master';
    const res = await fetch(`https://api.github.com/repos/bitcoin/bitcoin/git/trees/${commit}?recursive=1`);
    if (!res.ok) throw new Error('GitHub API error');
    const json = await res.json();
    const cppFiles = json.tree
      .filter(f => f.type === 'blob' && (f.path.endsWith('.cpp') || f.path.endsWith('.h')))
      .map(f => f.path);
    localStorage.setItem(GH_CACHE_KEY, JSON.stringify({ ts: Date.now(), data: cppFiles }));
    renderFileList(cppFiles);
  } catch (e) {
    console.warn('GitHub fetch failed, using tested files only:', e.message);
    renderFileList(null);
  }
}

// ── PR TITLES ─────────────────────────────────────────────────────────────────
const PR_TITLE_CACHE_KEY = 'btc_pr_titles_v1';
const PR_TITLE_CACHE_TTL = 24 * 60 * 60 * 1000;
let prTitles = {};

async function fetchPrTitles(prNums) {
  const cached = localStorage.getItem(PR_TITLE_CACHE_KEY);
  if (cached) {
    try {
      const { ts, data } = JSON.parse(cached);
      if (Date.now() - ts < PR_TITLE_CACHE_TTL) {
        prTitles = data;
        renderPrList();
        return;
      }
    } catch (e) {}
  }

  const results = {};
  await Promise.all(prNums.map(async prNum => {
    try {
      const res = await fetch(`https://api.github.com/repos/bitcoin/bitcoin/pulls/${prNum}`);
      if (!res.ok) return;
      const json = await res.json();
      results[prNum] = json.title || null;
    } catch (e) {}
  }));

  prTitles = results;
  localStorage.setItem(PR_TITLE_CACHE_KEY, JSON.stringify({ ts: Date.now(), data: results }));
  renderPrList();
}

// ── FILE LIST ─────────────────────────────────────────────────────────────────
let allGhFiles = null;

function renderFileList(ghFiles) {
  if (ghFiles !== undefined) allGhFiles = ghFiles;

  const q = fileSearchQuery.toLowerCase();
  const container = document.getElementById('fileList');
  container.innerHTML = '';

  let filesToShow = [];

  // If we're in a PR context, allGhFiles is just the PR's tested files — skip GH tree merge
  const inPrContext = selectedPr !== null;

  if (!inPrContext && allGhFiles && Array.isArray(allGhFiles) && allGhFiles.some(f => f.startsWith('src/'))) {
    // Weekly view with GH tree
    allGhFiles.filter(f => f.startsWith('src/')).forEach(f => {
      filesToShow.push({ path: f, hasDat: !!testedFiles[f], stats: testedFiles[f] || null });
    });
    Object.keys(testedFiles).forEach(f => {
      if (!filesToShow.find(x => x.path === f))
        filesToShow.push({ path: f, hasDat: true, stats: testedFiles[f] });
    });
  } else {
    // PR context or GH fetch not available — show only tested files
    Object.keys(testedFiles).forEach(f =>
      filesToShow.push({ path: f, hasDat: true, stats: testedFiles[f] }));
  }

  if (q) filesToShow = filesToShow.filter(f => f.path.toLowerCase().includes(q));

  const tested   = filesToShow.filter(f =>  f.hasDat);
  const untested = filesToShow.filter(f => !f.hasDat);

  if (tested.length > 0) {
    const lbl = document.createElement('div');
    lbl.className = 'file-group-label';
    lbl.textContent = `Analyzed (${tested.length})`;
    container.appendChild(lbl);
    tested.forEach(f => container.appendChild(makeFileItem(f)));
  }
  if (untested.length > 0) {
    const lbl = document.createElement('div');
    lbl.className = 'file-group-label';
    lbl.textContent = `Not analyzed (${untested.length})`;
    container.appendChild(lbl);
    untested.forEach(f => container.appendChild(makeFileItem(f)));
  }
}

function makeFileItem(f) {
  const div = document.createElement('div');
  div.className = 'file-item' + (!f.hasDat ? ' disabled' : '') + (selectedFile === f.path ? ' active' : '');
  div.dataset.path = f.path;

  let badge = '';
  if (f.stats) {
    const score = getMutationScore(f.stats);
    const cl = scoreClass(score);
    const label = f.stats.pending > 0 && score === null ? '⏳' : (score !== null ? score + '%' : '⏳');
    badge = `<span class="score-badge ${cl}">${label}</span>`;
  }

  const parts = f.path.split('/');
  const fname = parts.pop();
  const fdir  = parts.join('/') + (parts.length ? '/' : '');

  div.innerHTML = `
    <div class="score-pip" style="background:${f.stats ? scoreColor(getMutationScore(f.stats)) : 'var(--border)'}"></div>
    <span class="file-name"><span class="file-dir">${fdir}</span>${fname}</span>
    ${badge}
  `;
  if (f.hasDat) div.onclick = () => selectFile(f.path);
  return div;
}

function filterFiles(q) {
  fileSearchQuery = q;
  renderFileList();
}

// ── SELECT FILE ───────────────────────────────────────────────────────────────
function selectFile(path) {
  selectedFile = path;
  selectedMutantId = null;
  mutantFilter = 'all';
  document.querySelectorAll('.file-item').forEach(el =>
    el.classList.toggle('active', el.dataset.path === path));
  renderFileDetail(path);
  syncUrl();
  if (window.innerWidth <= 768) closeSidebar();
}

// Returns the correct content container depending on current view
function getContentContainer() {
  return selectedPr !== null
    ? document.getElementById('prDetailContent')
    : document.getElementById('weeklyContent');
}

// ── OVERVIEW ──────────────────────────────────────────────────────────────────
function renderOverview() {
  const container = getContentContainer();

  const killed   = DB.mutants.filter(m => m.status === 'killed').length;
  const survived = DB.mutants.filter(m => m.status === 'survived').length;
  const pending  = DB.mutants.filter(m => m.status === 'pending').length;
  const score    = Math.round(killed / (killed + survived) * 100);
  const commit   = DB.runs[0]?.commit_hash || '';

  const fileRows = Object.entries(testedFiles).map(([path, stats]) => {
    const sc = getMutationScore(stats);
    const scCl = scoreClass(sc);
    const parts = path.split('/');
    const fname = parts.pop();
    const fdir  = parts.join('/') + '/';
    const barW  = sc !== null ? sc : 0;
    const barColor = scoreColor(sc);
    return `
      <tr onclick="selectFile('${path}')">
        <td><span style="color:var(--text3)">${fdir}</span>${fname}</td>
        <td style="color:var(--killed)">${stats.killed}</td>
        <td style="color:var(--survived)">${stats.survived}</td>
        <td style="color:var(--pending)">${stats.pending}</td>
        <td>
          <div class="score-bar-wrap">
            <div class="score-bar"><div class="score-bar-fill" style="width:${barW}%;background:${barColor}"></div></div>
            <span class="score-badge ${scCl}" style="min-width:44px;text-align:right">${sc !== null ? sc + '%' : '⏳'}</span>
          </div>
        </td>
      </tr>`;
  }).join('');

  container.innerHTML = `
    <div class="overview fade-in">
      <div class="overview-title">Mutation Testing Report</div>
      <div class="overview-sub">commit ${commit} &nbsp;·&nbsp; ${DB.runs.length} runs &nbsp;·&nbsp; ${new Date(DB.runs[DB.runs.length-1]?.created_at).toLocaleDateString()}</div>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Mutation Score</div>
          <div class="stat-value orange">${score}%</div>
          <div class="stat-sub">${killed} killed / ${killed+survived} tested</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Killed</div>
          <div class="stat-value green">${killed.toLocaleString()}</div>
          <div class="stat-sub">mutants caught by tests</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Survived</div>
          <div class="stat-value red">${survived.toLocaleString()}</div>
          <div class="stat-sub">mutants not caught</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Pending</div>
          <div class="stat-value yellow">${pending.toLocaleString()}</div>
          <div class="stat-sub">not yet evaluated</div>
        </div>
      </div>
      <div class="section-title">Files Analyzed</div>
      <table class="files-table">
        <thead><tr><th>File</th><th>Killed</th><th>Survived</th><th>Pending</th><th>Score</th></tr></thead>
        <tbody>${fileRows}</tbody>
      </table>
    </div>`;
}

// ── FILE DETAIL ───────────────────────────────────────────────────────────────
function renderFileDetail(path) {
  const stats = testedFiles[path];
  const score = getMutationScore(stats);
  const container = getContentContainer();
  const backFn = selectedPr !== null ? `selectPr('${selectedPr}')` : 'backToOverview()';
  const parts = path.split('/');
  const fname = parts.pop();
  const fdir  = parts.join('/') + '/';
  const allMutants = selectedPr ? (PR_DATA[selectedPr]?.mutants || []) : DB.mutants;
  const fileMutants = allMutants.filter(m => m.file_path === path);

  container.innerHTML = `
    <div class="file-detail fade-in">
      <div class="detail-header">
        <button onclick="${backFn}" style="background:none;border:none;color:var(--text2);cursor:pointer;font-size:16px;padding:0 4px;margin-right:4px;" title="Back">←</button>
        <div class="detail-filepath"><span class="dir">${fdir}</span>${fname}</div>
        <div class="detail-stats">
          <div class="detail-stat"><div class="dot dot-killed"></div><span style="color:var(--killed)">${stats.killed}</span><span style="color:var(--text3)">killed</span></div>
          <div class="detail-stat"><div class="dot dot-survived"></div><span style="color:var(--survived)">${stats.survived}</span><span style="color:var(--text3)">survived</span></div>
          ${stats.pending ? `<div class="detail-stat"><div class="dot dot-pending"></div><span style="color:var(--pending)">${stats.pending}</span><span style="color:var(--text3)">pending</span></div>` : ''}
          <div class="detail-stat" style="margin-left:4px">
            <span class="score-badge ${scoreClass(score)}">${score !== null ? score + '%' : '⏳'}</span>
          </div>
        </div>
      </div>
      <div class="detail-body">
        <div class="mutant-list-panel">
          <div class="mutant-list-toolbar" id="filterToolbar"></div>
          <div class="mutant-list" id="mutantList"></div>
          <div class="mutant-count" id="mutantCount"></div>
        </div>
        <div class="diff-panel">
          <div class="diff-toolbar">
            <div class="diff-toolbar-label" id="diffLabel">Select a mutant to view its diff</div>
            <button class="copy-btn" id="copyBtn" onclick="copyDiff()" style="display:none">
              <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"/><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"/></svg>
              <span class="btn-label">Copy diff</span>
            </button>
          </div>
          <div class="diff-content" id="diffContent">
            <div class="diff-empty"><div class="diff-empty-icon">⊕</div><div class="diff-empty-text">Select a mutant from the list</div></div>
          </div>
          <div class="cmd-panel" id="cmdPanel" style="display:none"></div>
        </div>
      </div>
    </div>`;

  renderMutantList(fileMutants);
}

function backToOverview() {
  selectedFile = null;
  selectedMutantId = null;
  document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
  renderOverview();
  syncUrl();
}
// ── MUTANT LIST ───────────────────────────────────────────────────────────────
function renderMutantList(fileMutants) {
  const toolbar = document.getElementById('filterToolbar');
  const list    = document.getElementById('mutantList');
  const countEl = document.getElementById('mutantCount');
  if (!toolbar || !list) return;

  const statuses = ['all', 'survived', 'killed', 'pending'].filter(s =>
    s === 'all' || fileMutants.some(m => m.status === s));

  toolbar.innerHTML = statuses.map(s => {
    const activeClass = mutantFilter === s ? `active-${s}` : '';
    const count = s === 'all' ? fileMutants.length : fileMutants.filter(m => m.status === s).length;
    return `<button class="filter-btn ${activeClass}" onclick="setFilter('${s}')">${s} (${count})</button>`;
  }).join('');

  const visible = mutantFilter === 'all' ? fileMutants : fileMutants.filter(m => m.status === mutantFilter);

  list.innerHTML = '';
  visible.forEach(m => {
    const div = document.createElement('div');
    div.className = 'mutant-item' + (selectedMutantId === m.id ? ' active' : '');
    div.dataset.id = m.id;
    const icons = { killed: '✕', survived: '✓', pending: '◷' };
    div.innerHTML = `
      <div class="mutant-status-icon si-${m.status}">${icons[m.status] || '?'}</div>
      <div class="mutant-info">
        <div class="mutant-id">#${m.id} · ${m.status}</div>
        <div class="mutant-op">${m.operator || '—'}</div>
      </div>`;
    div.onclick = () => selectMutant(m.id);
    list.appendChild(div);
  });

  countEl.textContent = `${visible.length} mutant${visible.length !== 1 ? 's' : ''}`;
}

function setFilter(status) {
  mutantFilter = status;
  if (selectedFile) {
    const allMutants = selectedPr ? (PR_DATA[selectedPr]?.mutants || []) : DB.mutants;
    renderMutantList(allMutants.filter(m => m.file_path === selectedFile));
  }
}

// ── DIFF ──────────────────────────────────────────────────────────────────────
function selectMutant(id) {
  selectedMutantId = id;
  document.querySelectorAll('.mutant-item').forEach(el =>
    el.classList.toggle('active', parseInt(el.dataset.id) === id));

  const diff   = DIFFS[String(id)] || DIFFS[id] || '';
  const allMutants = selectedPr ? (PR_DATA[selectedPr]?.mutants || []) : DB.mutants;
  const mutant = allMutants.find(m => m.id === id);

  const label   = document.getElementById('diffLabel');
  const copyBtn = document.getElementById('copyBtn');
  if (label) {
    const sc = mutant?.status === 'killed' ? 'var(--killed)' : mutant?.status === 'survived' ? 'var(--survived)' : 'var(--pending)';
    label.innerHTML = `<span style="color:var(--text3)">mutant #${id}</span>
      &nbsp;·&nbsp; <span style="font-size:11px;color:${sc}">${mutant?.status || ''}</span>
      &nbsp;·&nbsp; <span style="color:var(--text2);font-family:var(--font-mono);font-size:11px">${mutant?.operator || ''}</span>`;
  }
  if (copyBtn) copyBtn.style.display = '';

  // Show/update report button
  let reportBtn = document.getElementById('reportBtn');
  if (!reportBtn) {
    reportBtn = document.createElement('button');
    reportBtn.id = 'reportBtn';
    reportBtn.className = 'report-btn';
    copyBtn.parentNode.insertBefore(reportBtn, copyBtn);
  }
  reportBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M8 9.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"/><path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Z"/></svg><span class="btn-label"> Report</span>`;
  reportBtn.onclick = () => reportMutant(id);

  renderDiff(diff);
  if (mutant?.file_path) renderCommand(mutant.file_path);
  syncUrl();
}

function renderDiff(diffText) {
  const container = document.getElementById('diffContent');
  if (!diffText) {
    container.innerHTML = '<div class="diff-empty"><div class="diff-empty-icon">∅</div><div class="diff-empty-text">No diff available</div></div>';
    return;
  }

  const lines = diffText.split('\n');
  let leftNum = 0, rightNum = 0, rows = '';

  lines.forEach(line => {
    let cls = '', ln = '', rn = '';
    if (line.startsWith('@@')) {
      cls = 'diff-line-hunk';
      const m = line.match(/@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
      if (m) { leftNum = parseInt(m[1]) - 1; rightNum = parseInt(m[2]) - 1; }
    } else if (line.startsWith('---') || line.startsWith('+++') || line.startsWith('diff ') || line.startsWith('index ')) {
      cls = 'diff-line-hunk';
    } else if (line.startsWith('+')) {
      cls = 'diff-line-add'; rightNum++; rn = String(rightNum);
    } else if (line.startsWith('-')) {
      cls = 'diff-line-rem'; leftNum++; ln = String(leftNum);
    } else {
      leftNum++; rightNum++; ln = String(leftNum); rn = String(rightNum);
    }
    const esc = line.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    rows += `<tr class="${cls}"><td class="diff-line-num">${ln}</td><td class="diff-line-num">${rn}</td><td class="diff-line-code">${esc}</td></tr>`;
  });

  container.innerHTML = `<table class="diff-table"><tbody>${rows}</tbody></table>`;
}

// ── COMMAND PANEL ─────────────────────────────────────────────────────────────
function renderCommand(filePath) {
  const panel = document.getElementById('cmdPanel');
  if (!panel) return;
  const cmd = FILE_CMDS[filePath] || null;
  if (!cmd) { panel.style.display = 'none'; return; }
  panel.style.display = 'flex';

  const steps = cmd.split(' && ').map(s => s.trim()).filter(Boolean);

  function highlightCmd(s) {
    s = s.replace(/(FUZZ=\S+)/g, '<span class="cmd-fuzz-env">$1</span>');
    s = s.replace(/(\.\/(build\/[^\s]+))/g, '<span class="cmd-binary">$1</span>');
    s = s.replace(/(--[\w=_]+)/g, '<span class="cmd-flag">$1</span>');
    return s;
  }

  const stepsHtml = steps.map((s, i) => `
    <div class="cmd-step">
      <div class="cmd-step-num">${i + 1}</div>
      <div class="cmd-step-text">${highlightCmd(s)}</div>
    </div>`).join('');

  panel.innerHTML = `
    <div class="cmd-header">
      <div class="cmd-title"><div class="cmd-title-dot"></div>Test Command (${steps.length} step${steps.length !== 1 ? 's' : ''})</div>
      <button class="cmd-copy-btn" id="cmdCopyBtn" onclick="copyCommand('${filePath.replace(/'/g, "\\'")}')">
        <svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"/><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"/></svg>
        Copy
      </button>
    </div>
    <div class="cmd-body"><div class="cmd-steps">${stepsHtml}</div></div>`;
}

function copyCommand(filePath) {
  const cmd = FILE_CMDS[filePath] || '';
  navigator.clipboard.writeText(cmd).then(() => {
    const btn = document.getElementById('cmdCopyBtn');
    if (!btn) return;
    btn.classList.add('copied');
    btn.textContent = '✓ Copied!';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = `<svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"/></svg> Copy`;
    }, 2000);
  });
}

function copyDiff() {
  if (selectedMutantId === null) return;
  const diff = DIFFS[String(selectedMutantId)] || DIFFS[selectedMutantId] || '';
  navigator.clipboard.writeText(diff).then(() => {
    const btn = document.getElementById('copyBtn');
    if (!btn) return;
    btn.classList.add('copied');
    btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z"/></svg> Copied!`;
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"/><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"/></svg> Copy diff`;
    }, 2000);
  });
}

// ── REPORT MUTANT ─────────────────────────────────────────────────────────────
const GITHUB_REPO = 'brunoerg/bcore-mutation-ui';

function reportMutant(id) {
  // Look in PR mutants first, then weekly
  const allMutants = selectedPr
    ? (PR_DATA[selectedPr]?.mutants || [])
    : DB.mutants;
  const mutant = allMutants.find(m => m.id === id);
  if (!mutant) return;
  const diff = DIFFS[String(id)] || DIFFS[id] || '(no diff available)';

  const title = `Equivalent/not useful mutant #${id} in ${mutant.file_path}`;

  const body = [
    `## Mutant Report`,
    ``,
    `| Field | Value |`,
    `|-------|-------|`,
    `| **Mutant ID** | #${id} |`,
    `| **File** | \`${mutant.file_path}\` |`,
    `| **Operator** | ${mutant.operator || '—'} |`,
    `| **Status** | ${mutant.status} |`,
    ``,
    `### Why is this mutant equivalent or not useful?`,
    ``,
    `<!-- Please explain why this mutant does not represent a meaningful code change -->`,
    ``,
    `### Diff`,
    ``,
    `\`\`\`diff`,
    diff,
    `\`\`\``,
  ].join('\n');

  const url = `https://github.com/${GITHUB_REPO}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`;
  window.open(url, '_blank');
}

// ── PR LIST ───────────────────────────────────────────────────────────────────
function renderPrList() {
  const container = document.getElementById('prContent');
  if (!container) return;

  const prEntries = Object.entries(PR_DATA).sort((a, b) => parseInt(b[0]) - parseInt(a[0]));

  if (prEntries.length === 0) {
    container.innerHTML = `
      <div class="pr-empty">
        <div class="pr-empty-icon">⚡</div>
        <div class="pr-empty-title">Per-PR Mutation Testing</div>
        <div class="pr-empty-sub">No PR-specific mutation runs found yet. When a PR run is added to the database it will appear here.</div>
      </div>`;
    return;
  }

  const cards = prEntries.map(([prNum, pr]) => {
    const s     = pr.stats;
    const total = s.killed + s.survived;
    const score = total > 0 ? Math.round(s.killed / total * 100) : null;
    const scCl  = scoreClass(score);
    const barW  = score !== null ? score : 0;
    const barColor = scoreColor(score);
    const files = [...new Set(pr.mutants.map(m => m.file_path))];
    const date  = pr.run.created_at ? new Date(pr.run.created_at).toLocaleDateString() : '—';
    const commit = pr.run.commit_hash ? pr.run.commit_hash.slice(0, 8) : '—';

    const title = prTitles[prNum];
    return `
      <div class="pr-card fade-in" onclick="selectPr('${prNum}')">
        <div class="pr-card-number">#${prNum}</div>
        <div class="pr-card-body">
          ${title ? `<div class="pr-card-title">${title}</div>` : ''}
          <div class="pr-card-meta">
            <span>commit ${commit}</span>
            <span>${files.length} file${files.length !== 1 ? 's' : ''}</span>
            <span>${date}</span>
          </div>
          <div class="pr-card-stats">
            <span class="pr-stat-pill score-high">${s.killed} killed</span>
            <span class="pr-stat-pill score-low">${s.survived} survived</span>
            ${s.pending ? `<span class="pr-stat-pill score-pending">${s.pending} pending</span>` : ''}
            <div class="pr-score-bar-wrap">
              <div class="score-bar" style="max-width:120px">
                <div class="score-bar-fill" style="width:${barW}%;background:${barColor}"></div>
              </div>
              <span class="score-badge ${scCl}">${score !== null ? score + '%' : '⏳'}</span>
            </div>
          </div>
        </div>
        <div class="pr-card-arrow">›</div>
      </div>`;
  }).join('');

  container.innerHTML = `
    <div class="pr-list-view fade-in">
      <div class="overview-title" style="margin-bottom:4px">Pull Request Runs</div>
      <div class="overview-sub" style="margin-bottom:20px">${prEntries.length} PR${prEntries.length !== 1 ? 's' : ''} analyzed</div>
      ${cards}
    </div>`;
}

// ── PR DETAIL ─────────────────────────────────────────────────────────────────
let selectedPr = null;

function selectPr(prNum) {
  selectedPr = prNum;
  const pr = PR_DATA[prNum];
  if (!pr) return;

  // Swap active data context so existing file/mutant/diff functions work
  window.DIFFS     = pr.diffs;
  window.FILE_CMDS = pr.file_cmds;

  // Build testedFiles for this PR
  testedFiles = {};
  pr.mutants.forEach(m => {
    if (!m.file_path) return;
    if (!testedFiles[m.file_path]) {
      testedFiles[m.file_path] = { killed: 0, survived: 0, pending: 0, mutants: [] };
    }
    testedFiles[m.file_path][m.status]++;
    testedFiles[m.file_path].mutants.push(m.id);
  });

  // Rebuild sidebar for this PR's files (no GH tree, only analyzed files)
  selectedFile = null;
  selectedMutantId = null;
  mutantFilter = 'all';
  renderFileList(Object.keys(testedFiles));   // pass tested files directly

  const s = pr.stats;
  const total = s.killed + s.survived;
  const score = total > 0 ? Math.round(s.killed / total * 100) : null;
  const scCl  = scoreClass(score);
  const commit = pr.run.commit_hash ? pr.run.commit_hash.slice(0, 8) : '—';
  const date   = pr.run.created_at ? new Date(pr.run.created_at).toLocaleDateString() : '—';
  const files  = Object.keys(testedFiles);

  const fileRows = Object.entries(testedFiles).map(([path, stats]) => {
    const sc = getMutationScore(stats);
    const parts = path.split('/');
    const fname = parts.pop();
    const fdir  = parts.join('/') + '/';
    const barW  = sc !== null ? sc : 0;
    return `
      <tr onclick="selectFile('${path.replace(/'/g, "\\'")}')">
        <td><span style="color:var(--text3)">${fdir}</span>${fname}</td>
        <td style="color:var(--killed)">${stats.killed}</td>
        <td style="color:var(--survived)">${stats.survived}</td>
        <td style="color:var(--pending)">${stats.pending}</td>
        <td>
          <div class="score-bar-wrap">
            <div class="score-bar"><div class="score-bar-fill" style="width:${barW}%;background:${scoreColor(sc)}"></div></div>
            <span class="score-badge ${scoreClass(sc)}" style="min-width:44px;text-align:right">${sc !== null ? sc + '%' : '⏳'}</span>
          </div>
        </td>
      </tr>`;
  }).join('');

  const prTitle = prTitles[prNum];
  const container = document.getElementById('prContent');
  container.innerHTML = `
    <div class="pr-detail-topbar">
      <button onclick="backToPrList()">←</button>
      <span style="color:var(--accent);font-weight:600">PR #${prNum}</span>
      ${prTitle ? `<span style="color:var(--text3)">·</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${prTitle}">${prTitle}</span>` : ''}
      <span style="color:var(--text3)">·</span>
      <span>commit ${commit}</span>
      <span style="color:var(--text3)">·</span>
      <span>${files.length} file${files.length !== 1 ? 's' : ''}</span>
      <span style="color:var(--text3)">·</span>
      <span>${date}</span>
      <span class="score-badge ${scCl}" style="margin-left:auto">${score !== null ? score + '%' : '⏳'}</span>
    </div>
    <div style="display:flex;flex-direction:column;flex:1;overflow:hidden;" id="prDetailContent">
      <div class="overview fade-in">
        <div class="stats-grid" style="margin-bottom:20px">
          <div class="stat-card">
            <div class="stat-label">Mutation Score</div>
            <div class="stat-value orange">${score !== null ? score + '%' : '—'}</div>
            <div class="stat-sub">${s.killed} killed / ${total} tested</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Killed</div>
            <div class="stat-value green">${s.killed}</div>
            <div class="stat-sub">mutants caught</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Survived</div>
            <div class="stat-value red">${s.survived}</div>
            <div class="stat-sub">mutants not caught</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Pending</div>
            <div class="stat-value yellow">${s.pending}</div>
            <div class="stat-sub">not yet evaluated</div>
          </div>
        </div>
        <div class="section-title">Files Analyzed</div>
        <table class="files-table">
          <thead><tr><th>File</th><th>Killed</th><th>Survived</th><th>Pending</th><th>Score</th></tr></thead>
          <tbody>${fileRows}</tbody>
        </table>
      </div>
    </div>`;

  // Wire file clicks to show detail inside prDetailContent
  document.querySelectorAll('.files-table tr[onclick]').forEach(tr => {
    tr.style.cursor = 'pointer';
  });

  syncUrl();
}

function backToPrList() {
  selectedPr = null;
  // Restore weekly data context
  const weeklyData = window._weeklySnapshot;
  if (weeklyData) {
    window.DIFFS     = weeklyData.diffs;
    window.FILE_CMDS = weeklyData.file_cmds;
    testedFiles      = weeklyData.testedFiles;
    renderFileList();
  }
  renderPrList();
  syncUrl();
}

// ── MOBILE SIDEBAR ────────────────────────────────────────────────────────────
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  const btn     = document.getElementById('burgerBtn');
  const isOpen  = sidebar.classList.contains('open');
  if (isOpen) {
    closeSidebar();
  } else {
    sidebar.classList.add('open');
    overlay.classList.add('active');
    btn.classList.add('open');
  }
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('active');
  document.getElementById('burgerBtn').classList.remove('open');
}

// ── VIEW SWITCHING ────────────────────────────────────────────────────────────
function switchView(view) {
  currentView = view;
  document.getElementById('viewWeekly').style.display = view === 'weekly' ? 'flex' : 'none';
  document.getElementById('viewPr').style.display     = view === 'pr'     ? 'flex' : 'none';
  document.getElementById('tabWeekly').classList.toggle('active', view === 'weekly');
  document.getElementById('tabPr').classList.toggle('active',     view === 'pr');

  // Restore weekly data context when switching back to weekly
  if (view === 'weekly' && window._weeklySnapshot) {
    selectedPr       = null;
    window.DIFFS     = window._weeklySnapshot.diffs;
    window.FILE_CMDS = window._weeklySnapshot.file_cmds;
    testedFiles      = { ...window._weeklySnapshot.testedFiles };
    renderFileList();
  }
  syncUrl();
}
</script>
